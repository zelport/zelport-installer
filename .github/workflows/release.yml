name: Release installer

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].[0-9]+'

permissions:
  contents: read

concurrency:
  group: installer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate tag and source version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]{8}\.[1-9][0-9]*$ ]]
          source_version=$(sed -n 's/^ZELPORT_INSTALLER_VERSION=//p' install.sh)
          test "$GITHUB_REF_NAME" = "v${source_version}"
      - name: Verify and build release assets
        run: |
          make check
          make release-assets
          (cd dist && sha256sum --check SHA256SUMS)

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Rebuild and publish exact assets
        shell: bash
        run: |
          set -euo pipefail
          source_version=$(sed -n 's/^ZELPORT_INSTALLER_VERSION=//p' install.sh)
          test "$GITHUB_REF_NAME" = "v${source_version}"
          make check
          make release-assets
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" \
            dist/install.sh dist/SHA256SUMS \
            --verify-tag \
            --title "Zelport Installer ${GITHUB_REF_NAME}"
      - name: Download the published release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir released
          gh release download "$GITHUB_REF_NAME" \
            --dir released
      - name: Create website installation token
        id: website-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.INSTALLER_SYNC_APP_ID }}
          private-key: ${{ secrets.INSTALLER_SYNC_PRIVATE_KEY }}
          owner: zelport
          repositories: zelport-web
          permission-contents: write
      - name: Check out website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zelport/zelport-web
          ref: main
          token: ${{ steps.website-token.outputs.token }}
          persist-credentials: true
          path: website
      - name: Verify release and synchronize website bytes
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-release-sync.py \
            --release-dir released \
            --website-script website/install.sh \
            --version "${GITHUB_REF_NAME#v}" \
            --github-output "$GITHUB_OUTPUT"
      - name: Record compared hashes
        shell: bash
        run: |
          {
            echo "Release SHA-256: ${{ steps.sync.outputs.release_sha256 }}"
            echo "Previous website SHA-256: ${{ steps.sync.outputs.website_sha256 }}"
            echo "Result SHA-256: ${{ steps.sync.outputs.result_sha256 }}"
            echo "Changed: ${{ steps.sync.outputs.changed }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit synchronized installer
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C website status --short)" = " M install.sh"
          git -C website config user.name zdeneksvarc
          git -C website config user.email 79550344+zdeneksvarc@users.noreply.github.com
          git -C website add -- install.sh
          test "$(git -C website diff --cached --name-only)" = "install.sh"
          git -C website commit -m "${{ steps.sync.outputs.commit_message }}"
          git -C website push origin HEAD:main
