name: Release installer

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].[0-9]+'

permissions:
  contents: read

concurrency:
  group: installer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate tag and source version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]{8}\.[1-9][0-9]*$ ]]
          source_version=$(sed -n 's/^ZELPORT_INSTALLER_VERSION=//p' install.sh)
          test "$GITHUB_REF_NAME" = "v${source_version}"
      - name: Verify and build release assets
        run: |
          make check
          make release-assets
          (cd dist && sha256sum --check SHA256SUMS)

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Rebuild and publish exact assets
        shell: bash
        run: |
          set -euo pipefail
          source_version=$(sed -n 's/^ZELPORT_INSTALLER_VERSION=//p' install.sh)
          test "$GITHUB_REF_NAME" = "v${source_version}"
          make check
          make release-assets
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" \
            dist/install.sh dist/SHA256SUMS \
            --verify-tag \
            --title "Zelport Installer ${GITHUB_REF_NAME}"
      - name: Download the published release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir released
          gh release download "$GITHUB_REF_NAME" \
            --dir released
          (cd released && sha256sum --check SHA256SUMS)
