name: Release installer

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-1][0-9].[0-9]+'

permissions:
  contents: read

concurrency:
  group: installer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate tag and source version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]{4}\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF_NAME" = "v$(make --no-print-directory version)"
      - name: Verify and build release assets
        run: make release-ready
      - name: Store verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zelport-installer-release-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download verified release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: zelport-installer-release-${{ github.run_id }}
          path: dist
      - name: Publish exact verified assets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$(make --no-print-directory version)"
          make verify-release-assets
          gh release create "$GITHUB_REF_NAME" \
            dist/install.sh dist/uninstall.sh dist/SHA256SUMS \
            --verify-tag \
            --title "Zelport Installer ${GITHUB_REF_NAME}"
      - name: Download the published release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir released
          gh release download "$GITHUB_REF_NAME" \
            --dir released
          make verify-release-assets DIST_DIR=released
          cmp dist/install.sh released/install.sh
          cmp dist/uninstall.sh released/uninstall.sh
          cmp dist/SHA256SUMS released/SHA256SUMS
